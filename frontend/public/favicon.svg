<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="favBaseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#131D35"/>
    </linearGradient>

    <linearGradient id="favBaseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="favDocFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="favLensRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="favAiSparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="1.5" y="1.5" width="37" height="37" rx="9.5" fill="url(#favBaseBg)" stroke="url(#favBaseBorder)" stroke-width="1.2"/>

  <!-- Patent Document (Folded Corner) -->
  <path d="M9.5 8 A2.5 2.5 0 0 1 12 5.5 H23.5 L30.5 12.5 V31.5 A2.5 2.5 0 0 1 28 34 H12 A2.5 2.5 0 0 1 9.5 31.5 Z" 
        fill="url(#favDocFill)" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Folded Corner Flap -->
  <path d="M23.5 5.5 V11.5 A1 1 0 0 0 24.5 12.5 H30.5" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Claims Lines -->
  <line x1="13.5" y1="10.5" x2="20" y2="10.5" stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="13.5" y1="14.5" x2="25" y2="14.5" stroke="#94A3B8" stroke-opacity="0.4" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="13.5" y1="18.5" x2="19" y2="18.5" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="1.3" stroke-linecap="round"/>

  <!-- AI Discovery Lens -->
  <circle cx="21.5" cy="23.5" r="6.8" fill="#0B132B" stroke="url(#favLensRingGrad)" stroke-width="1.8"/>

  <!-- AI Novelty Spark -->
  <path d="M21.5 19 Q21.5 23.5 26 23.5 Q21.5 23.5 21.5 28 Q21.5 23.5 17 23.5 Q21.5 23.5 21.5 19 Z" fill="#34D399" filter="url(#favAiSparkGlow)"/>
  <circle cx="21.5" cy="23.5" r="1.1" fill="#FFFFFF"/>
</svg>
